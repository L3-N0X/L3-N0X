name: Update language stats

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate-stats.mjs
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate languages SVG
        env:
          # Add a GH_STATS_TOKEN repo secret (repo + read:org scope) to include private repos (EatMe, Trackbridge, etc.).
          # Falls back to GITHUB_TOKEN (public repos only) if unset.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit updated SVG
        run: |
          if git diff --quiet assets/languages.svg; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git commit -m "chore: update language stats"
          git push
